name: 'Tests'

on:
  push:
    branches: ['2.x']

jobs:
  unit:
    name: 'Unit tests'
    runs-on: 'ubuntu-latest'
    env:
      SYMFONY_REQUIRE: '${{matrix.symfony-require}}'

    strategy:
      matrix:
        include:
          - php-version: '8.1'
            symfony-require: '6.4.*'
          - php-version: '8.2'
            symfony-require: '7.0.*'
          - php-version: '8.2'
            symfony-require: '7.1.*'
          - php-version: '8.2'
            symfony-require: '7.2.*'
          - php-version: '8.2'
            symfony-require: '7.3.*'
          - php-version: '8.2'
            symfony-require: '7.4.*'
          - php-version: '8.5'
            symfony-require: '6.4.*'
          - php-version: '8.5'
            symfony-require: '7.4.*'

    steps:
      - name: 'Setup PHP'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '${{ matrix.php-version }}'
          coverage: 'none'
          tools: 'flex'

      - name: 'Checkout sources'
        uses: 'actions/checkout@v3'

      - name: 'Install dependencies'
        run: 'composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist'

      - name: 'Execute Unit tests'
        run: 'vendor/bin/phpunit'

  coverage:
    name: 'Code coverage'
    runs-on: 'ubuntu-latest'

    strategy:
      matrix:
        php-version: ['8.1']

    steps:
      - name: 'Setup PHP'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '${{ matrix.php-version }}'
          coverage: 'pcov'

      - name: 'Checkout sources'
        uses: 'actions/checkout@v3'

      - name: 'Install dependencies'
        run: 'composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist'

      - name: 'Execute Unit tests'
        run: 'vendor/bin/phpunit --coverage-clover=coverage.xml'

      - name: 'Upload coverage file'
        uses: 'codecov/codecov-action@v3'
        with:
          files: 'coverage.xml'
